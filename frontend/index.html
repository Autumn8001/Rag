<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowledgeEngine - Enterprise RAG 控制台</title>
    <!-- 引入 Tailwind CSS Play CDN 及其插件 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- 引入 Google Fonts & Material Symbols Outlined 图标 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- 挂载 KnowledgeEngine 精致自定义配色主题配置 -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "tertiary-container": "#0f0069",
              "on-primary-container": "#7c839b",
              "error-container": "#ffdad6",
              "background": "#f7f9fb",
              "tertiary-fixed-dim": "#c3c0ff",
              "surface-tint": "#565e74",
              "on-secondary-container": "#006f66",
              "surface-bright": "#f7f9fb",
              "surface-container-low": "#f2f4f6",
              "on-primary-fixed-variant": "#3f465c",
              "surface-container-highest": "#e0e3e5",
              "on-primary-fixed": "#131b2e",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "inverse-surface": "#2d3133",
              "surface-container-lowest": "#ffffff",
              "surface-container": "#eceef0",
              "surface-variant": "#e0e3e5",
              "on-surface": "#191c1e",
              "on-secondary-fixed-variant": "#005049",
              "tertiary": "#000000",
              "primary": "#000000",
              "on-error": "#ffffff",
              "on-tertiary": "#ffffff",
              "on-background": "#191c1e",
              "on-tertiary-fixed-variant": "#3323cc",
              "outline": "#76777d",
              "surface": "#f7f9fb",
              "primary-container": "#131b2e",
              "on-tertiary-container": "#7671ff",
              "primary-fixed-dim": "#bec6e0",
              "on-secondary": "#ffffff",
              "on-secondary-fixed": "#00201d",
              "secondary-container": "#86f2e4",
              "on-tertiary-fixed": "#0f0069",
              "inverse-on-surface": "#eff1f3",
              "surface-container-high": "#e6e8ea",
              "surface-dim": "#d8dadc",
              "secondary": "#006a61",
              "on-surface-variant": "#45464d",
              "outline-variant": "#c6c6cd",
              "primary-fixed": "#dae2fd",
              "secondary-fixed-dim": "#6bd8cb",
              "secondary-fixed": "#89f5e7",
              "tertiary-fixed": "#e2dfff",
              "error": "#ba1a1a",
              "inverse-primary": "#bec6e0"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            },
            "spacing": {
              "lg": "48px",
              "sm": "12px",
              "xl": "80px",
              "base": "8px",
              "margin-mobile": "16px",
              "gutter": "24px",
              "margin-desktop": "40px",
              "max-width": "1280px",
              "xs": "4px",
              "md": "24px"
            },
            "fontFamily": {
              "body-md": ["Inter"],
              "headline-lg-mobile": ["Inter"],
              "display": ["Inter"],
              "code": ["JetBrains Mono"],
              "headline-md": ["Inter"],
              "body-sm": ["Inter"],
              "headline-lg": ["Inter"],
              "label-md": ["Inter"],
              "body-lg": ["Inter"]
            },
            "fontSize": {
              "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
              "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
              "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
              "code": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
              "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
              "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
              "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
              "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
              "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
            }
          }
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
